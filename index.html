<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Title, meta, Open Graph and JSON-LD are generated from src/content.js -->
    <!--app-head-->
    <script>
      // Mark JS as available so the hero can start hidden for its intro animation.
      // Safety net: if the app script fails, show everything after 3.5s.
      document.documentElement.classList.add('js');
      setTimeout(function () {
        if (!window.__appReady) document.documentElement.classList.remove('js');
      }, 3500);
    </script>
  </head>
  <body>
    <!-- Page sections are generated from src/content.js by src/render.js -->
    <!--app-body-->
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
